server:
  port: 8083

spring:
  application:
    name: poc-integration

andes:
  api:
    server:
      correlation:
        enabled: true
      response:
        wrap-enabled: true
      error-handling:
        enabled: true
      openapi:
        enabled: true
        title: Andes Integration PoC
        description: Own Checkout API that internally consumes the external Orders API
        version: 1.0.0
    client:
      clients:
        orders:
          base-url: http://localhost:8083
          connect-timeout: 2s
          read-timeout: 5s

logging:
  level:
    pe.andes: DEBUG
