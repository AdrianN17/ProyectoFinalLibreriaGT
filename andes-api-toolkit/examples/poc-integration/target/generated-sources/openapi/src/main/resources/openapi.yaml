openapi: 3.0.3
info:
  contact:
    email: support@andes.pe
    name: Andes API Toolkit Team
  description: |
    API propia expuesta por el PoC Integration. Internamente delega en la libreria Client (andes-api-client) para colocar la orden en la Orders API externa (ver contracts/openapi-client-a.yaml), demostrando el flujo: Own API -> Business logic -> Client Library -> Remote API -> Standardized response.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Andes Integration PoC - Checkout API
  version: 1.0.0
servers:
- description: Local development server
  url: http://localhost:8083
tags:
- description: Own checkout API backed internally by an external Orders API
  name: Checkouts
paths:
  /api/v1/checkouts:
    post:
      operationId: createCheckout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutEnvelope'
          description: Checkout created
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error
      summary: "Place a checkout, which internally creates an order in the external\
        \ Orders API"
      tags:
      - Checkouts
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Checkouts
  /api/v1/checkouts/{orderId}:
    get:
      operationId: getCheckout
      parameters:
      - explode: false
        in: path
        name: orderId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutEnvelope'
          description: Checkout found
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Checkout not found
      summary: Retrieve a previously placed checkout by its remote order id
      tags:
      - Checkouts
      x-accepts:
      - application/json
      x-tags:
      - tag: Checkouts
components:
  schemas:
    CheckoutItem:
      example:
        unitPrice: 5.962133916683182
        quantity: 1
        sku: sku
      properties:
        sku:
          type: string
        quantity:
          type: integer
        unitPrice:
          format: double
          type: number
      required:
      - quantity
      - sku
      - unitPrice
      type: object
    CheckoutRequest:
      example:
        customerId: 0
        items:
        - unitPrice: 5.962133916683182
          quantity: 1
          sku: sku
        - unitPrice: 5.962133916683182
          quantity: 1
          sku: sku
      properties:
        customerId:
          format: int64
          type: integer
        items:
          items:
            $ref: '#/components/schemas/CheckoutItem'
          minItems: 1
          type: array
      required:
      - customerId
      - items
      type: object
    CheckoutResult:
      example:
        totalAmount: 6.027456183070403
        orderId: orderId
        customerId: 0
        items:
        - unitPrice: 5.962133916683182
          quantity: 1
          sku: sku
        - unitPrice: 5.962133916683182
          quantity: 1
          sku: sku
        status: status
      properties:
        orderId:
          type: string
        customerId:
          format: int64
          type: integer
        totalAmount:
          format: double
          type: number
        status:
          type: string
        items:
          items:
            $ref: '#/components/schemas/CheckoutItem'
          type: array
      type: object
    CheckoutEnvelope:
      example:
        metadata:
          traceId: traceId
          apiVersion: apiVersion
          requestId: requestId
          correlationId: correlationId
          timestamp: 2000-01-23T04:56:07.000+00:00
        data:
          totalAmount: 6.027456183070403
          orderId: orderId
          customerId: 0
          items:
          - unitPrice: 5.962133916683182
            quantity: 1
            sku: sku
          - unitPrice: 5.962133916683182
            quantity: 1
            sku: sku
          status: status
        success: true
        error:
          traceId: traceId
          code: code
          httpStatus: 5
          details:
          - code: code
            field: field
            message: message
            rejectedValue: ""
          - code: code
            field: field
            message: message
            rejectedValue: ""
          message: message
          timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/CheckoutResult'
        error:
          $ref: '#/components/schemas/ApiError'
        metadata:
          $ref: '#/components/schemas/ApiMetadata'
      type: object
    ErrorEnvelope:
      example:
        metadata:
          traceId: traceId
          apiVersion: apiVersion
          requestId: requestId
          correlationId: correlationId
          timestamp: 2000-01-23T04:56:07.000+00:00
        data: ""
        success: false
        error:
          traceId: traceId
          code: code
          httpStatus: 5
          details:
          - code: code
            field: field
            message: message
            rejectedValue: ""
          - code: code
            field: field
            message: message
            rejectedValue: ""
          message: message
          timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        success:
          example: false
          type: boolean
        data:
          nullable: true
        error:
          $ref: '#/components/schemas/ApiError'
        metadata:
          $ref: '#/components/schemas/ApiMetadata'
      type: object
    ApiError:
      example:
        traceId: traceId
        code: code
        httpStatus: 5
        details:
        - code: code
          field: field
          message: message
          rejectedValue: ""
        - code: code
          field: field
          message: message
          rejectedValue: ""
        message: message
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        code:
          type: string
        message:
          type: string
        httpStatus:
          type: integer
        traceId:
          type: string
        timestamp:
          format: date-time
          type: string
        details:
          items:
            $ref: '#/components/schemas/ApiErrorDetail'
          type: array
      type: object
    ApiErrorDetail:
      example:
        code: code
        field: field
        message: message
        rejectedValue: ""
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
        rejectedValue:
          nullable: true
      type: object
    ApiMetadata:
      example:
        traceId: traceId
        apiVersion: apiVersion
        requestId: requestId
        correlationId: correlationId
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        traceId:
          type: string
        correlationId:
          type: string
        requestId:
          type: string
        apiVersion:
          type: string
        timestamp:
          format: date-time
          type: string
      type: object
