jdk:
  - openjdk21
# Algunos workers de JitPack traen un Maven roto (falta plexus Launcher): se descarga uno propio y se reintenta por 429 transitorios.
install:
  - curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz | tar xz -C $HOME
  - $HOME/apache-maven-3.9.9/bin/mvn -B clean install -DskipTests || (sleep 45 && $HOME/apache-maven-3.9.9/bin/mvn -B clean install -DskipTests)
